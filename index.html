
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LM's Boutique | Shop Online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fffaf7;
      color: #333;
    }

    header {
      background: #8b4a62;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 6px;
      font-size: 14px;
    }

    nav {
      background: white;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    nav a {
      color: #8b4a62;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 55px 20px;
      background: linear-gradient(135deg, #f8e4ea, #fffaf7);
    }

    .hero h2 {
      font-size: 38px;
      color: #8b4a62;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 17px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #8b4a62;
      color: white;
      padding: 13px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .section h2 {
      color: #8b4a62;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .category {
      background: white;
      padding: 25px 15px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .category .icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .category h3 {
      color: #8b4a62;
      margin-bottom: 8px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product-image {
      background: #f3dce3;
      height: 160px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      margin-bottom: 15px;
    }

    .product h3 {
      color: #8b4a62;
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .about {
      max-width: 800px;
      margin: auto;
      line-height: 1.7;
    }

    .contact {
      background: #f8e4ea;
    }

    footer {
      background: #8b4a62;
      color: white;
      text-align: center;
      padding: 25px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 30px;
      }

      nav a {
        display: inline-block;
        margin: 5px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>LM's Boutique</h1>
    <p>Style • Beauty • Confidence</p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#categories">Categories</a>
    <a href="#about">About Us</a>
    <a href="#contact">Contact</a>
  </nav>

  <section class="hero" id="home">
    <h2>Welcome to LM's Boutique</h2>
    <p>Discover beautiful products at affordable prices.</p>
    <a href="#shop" class="button">Shop Now</a>
  </section>

    <h2>Shop By Category</h2>

        <div class="icon">👗</div>
        <h3>Fashion</h3>
        <p>Trendy fashion finds</p>
      </div>

        <div class="icon">💄</div>
        <h3>Beauty</h3>
        <p>Beauty & personal care</p>
